name: Publish OsyC release assets

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release. Only allowed outside the default branch; a pre-release for the default-branch manifest version de-lists the plug-in from the Obsidian Community directory.
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release revision
        uses: actions/checkout@v4

      - name: Attest plugin assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Update the OsyC release assets
        uses: actions/github-script@v7
        with:
          script: |
            const manifestResponse = await fetch(
              `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${context.sha}/manifest.json`,
            );
            if (!manifestResponse.ok) throw new Error(`Could not fetch manifest.json: ${manifestResponse.status}`);
            const manifest = JSON.parse(await manifestResponse.text());
            const version = manifest.version;
            if (typeof version !== 'string' || !/^\d+\.\d+\.\d+/.test(version)) {
              throw new Error(`Invalid plugin version: ${version}`);
            }

            const requestedPrerelease = context.eventName === 'workflow_dispatch'
              ? String(context.payload.inputs?.prerelease ?? 'false') === 'true'
              : null;
            // The Obsidian Community directory reads `manifest.json` at the
            // default branch HEAD and matches only a *published* release for
            // that version. A pre-release for the default branch's version
            // therefore removes the plug-in from the directory until someone
            // promotes it (the 2026-09-17 de-listing). Refuse that state up
            // front, before any release or asset is touched.
            const defaultBranch = context.payload.repository?.default_branch ?? 'main';
            const onDefaultBranch = context.ref === `refs/heads/${defaultBranch}`;
            if ((requestedPrerelease ?? false) && onDefaultBranch) {
              core.setFailed(
                `Refusing to publish a pre-release for ${version} from ${defaultBranch}: the Obsidian Community ` +
                'directory matches published releases only, so this would de-list the plug-in. ' +
                'Publish it as a normal release, or keep the candidate in manifest-beta.json and publish it from a branch.',
              );
              return;
            }
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: version,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: version,
                name: `OsyC ${version}`,
                body: `Auditable OsyC client release ${version}. See the repository source and README for build, privacy, and attribution details.`,
                target_commitish: context.sha,
                draft: false,
                // Pushes publish directly. The directory needs a published
                // release for the default branch's manifest version.
                prerelease: requestedPrerelease ?? false,
              });
            }
            // A normal push refreshes assets without changing an existing
            // stable release back into a prerelease. Only an explicit manual
            // dispatch may change the channel after publication.
            if (requestedPrerelease !== null && release.data.prerelease !== requestedPrerelease) {
              release = await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                prerelease: requestedPrerelease,
              });
            }

            const files = [
              ['main.js', 'application/javascript'],
              ['manifest.json', 'application/json'],
              ['styles.css', 'text/css'],
            ];

            for (const [name] of files) {
              const existing = release.data.assets.find((asset) => asset.name === name);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: existing.id,
                });
              }
            }

            for (const [name, contentType] of files) {
              const response = await fetch(
                `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${context.sha}/${name}`,
              );
              if (!response.ok) throw new Error(`Could not fetch ${name}: ${response.status}`);
              const body = Buffer.from(await response.arrayBuffer());
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name,
                data: body,
                headers: { 'content-type': contentType, 'content-length': body.length },
              });
            }
