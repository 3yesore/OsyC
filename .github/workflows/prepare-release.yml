name: Prepare release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: string
      base_branch:
        description: Reviewed base branch
        required: true
        default: main
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the version lifecycle
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          git add package-lock.json manifest.json versions.json src/apps/cli/package.json src/apps/webpeer/package.json src/apps/webapp/package.json
      - name: Validate release notes
        env:
          VERSION: ${{ inputs.version }}
        run: node utils/release-notes.mjs validate "${VERSION}"
      - name: Build release PR body
        env:
          VERSION: ${{ inputs.version }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: node utils/release-pr-body.mjs "${VERSION}" "${BASE_BRANCH}" > release-pr-body.md
      - name: Push release branch and open PR
        env:
          VERSION: ${{ inputs.version }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b "release/${VERSION}"
          git add -A
          git commit -m "release: prepare ${VERSION}"
          git push --set-upstream origin "release/${VERSION}"
          gh pr create --base "${BASE_BRANCH}" --head "release/${VERSION}" --title "release: ${VERSION}" --body-file release-pr-body.md
